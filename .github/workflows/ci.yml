name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Pipeline tests (pytest)
        run: pytest -q
      - name: API tests (Django)
        run: python api/manage.py test upload
      - name: Python and JavaScript pipelines give the same result
        run: node tests/test_parity.mjs
