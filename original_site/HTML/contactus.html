<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <div class="container">
        <div class="contacttext" style="text-align:center">
          <h1>Contact Us</h1>
          <hr>
          <p>Leave us a message:</p>
        </div>
        <div class="row">
          <div class="column">
            <form action="#" onsubmit="event.preventDefault(); this.querySelector('.mockup-note').hidden = false;">
              <label for="fname"><b>First Name</b></label>
              <input type="text" id="fname" name="firstname" placeholder="Your name.." required>
              <label for="email"><b>Email id</b></label>
              <input type="text" id="lname" name="lastname" placeholder="Your Email id.." required>
              
              <label for="subject"><b>Subject</b></label>
              <textarea id="subject" name="subject" placeholder="Write something.." style="height:170px" required></textarea>
              <input type="submit" value="Submit">
              <p class="mockup-note" hidden>This contact form is a design mockup; messages are not sent.</p>
            </form>
          </div>
        </div>
      </div>
</body>
</html>
